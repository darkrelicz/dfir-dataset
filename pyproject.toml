[project]
name = "dfir-dataset"
version = "0.1.0"
description = "DFIR Task Taxonomy and Dataset for Shepherd fine-tuning"
requires-python = ">=3.11"
readme = "README.md" 
dependencies = [
    "artifacts>=20260421",
    "pyyaml",
    "pydantic>=2.0",
    "jsonlines",
    "google-genai",
    "rich",
    "mitreattack-python>=1.0",
    "requests>=2.31",
    "lxml",
    "gitpython>=3.1",
    "tqdm>=4.60"
]

[project.scripts]
dfir-collect = "scripts.collect_all:main"
dfir-synthesize = "scripts.synthesize:main"
dfir-quality = "scripts.quality_filter:main"
dfir-package = "scripts.package_dataset:main"

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "collectors*",
    "scripts*",
    "taxonomy*",
    "quality*",
    "evaluation*",
    "dataset_packaging*",
    "synthesizers*",
    "validation*",
    "utils*",
]

[tool.pytest.ini_options]
pythonpath = "."
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 88
