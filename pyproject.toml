[project]
name = "dfir-dataset"
version = "0.1.0"
description = "DFIR Task Taxonomy and Dataset for Shepherd fine-tuning"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "pydantic>=2.0",
    "jsonlines",
    "rich"
]

[project.scripts]
dfir-collect = "scripts.collect_all:main"

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = "."
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 88
