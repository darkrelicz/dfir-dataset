[project]
name = "dfir-dataset"
version = "0.1.0"
description = "DFIR Task Taxonomy and Dataset for Shepherd fine-tuning"
requires-python = ">=3.11"
readme = "README.md" 
dependencies = [
    "artifacts>=20260421",
    "pyyaml",
    "pydantic>=2.0",
    "jsonlines",
    "google-genai",
    "rich",
    "mitreattack-python>=1.0",
    "requests>=2.31",
    "lxml",
    "gitpython>=3.1",
    "tqdm>=4.60",
    "unsloth>=2026.1.3",
    "transformers==5.3.0",
    "trl==0.22.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.15",
]
training-cuda130 = [
    # Install Torch first from the PyTorch CUDA wheel index:
    # pip install torch==2.10.0+cu130 --index-url https://download.pytorch.org/whl/cu130
    # Then install this project with:
    # pip install -e ".[training-cuda130]"
    "torch==2.10.0",
    "fsspec[http]>=2023.1.0,<=2025.9.0",
]

[project.scripts]
dfir-collect = "scripts.collect_all:main"
dfir-synthesize = "scripts.synthesize:main"
dfir-quality = "scripts.quality_filter:main"
dfir-package = "scripts.package_dataset:main"
dfir-evaluate = "scripts.run_evaluation:main"
dfir-compare-evals = "scripts.compare_evaluations:main"
dfir-train-lora = "scripts.finetune:main"

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "collectors*",
    "scripts*",
    "taxonomy*",
    "quality*",
    "evaluation*",
    "dataset_packaging*",
    "synthesizers*",
    "validation*",
    "utils*",
]

[tool.pytest.ini_options]
pythonpath = "."
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 88
