# configs/synthesis.yaml
model:
  api: "generate_content"
  api_key_env: "GEMINI_API_KEY"
  primary: "gemini-2.5-flash"      # Primary teacher model for Phase 3
  fallback: null                   # Comparison models must run as separate, explicit jobs
generation:
  thinking_budget: 1024          # Gemini 2.5 uses token budgets, not thinking_level
  pairs_per_document:
    # Budget-safe full synthesis: generate breadth first, then add more pairs
    # only for selected high-value sources if budget remains.
    mitre_attack: 1
    sigma_rules: 1
    atomic_red_team: 1
    cisa_advisories: 1
    volatility3_docs: 1
    mitre_atlas: 1
    cisa_kev: 1
    kape_files: 1
    hayabusa_rules: 1
    lolbas_gtfobins: 1
    forensic_artifacts: 1
    velociraptor_artifacts: 1
    hijacklibs: 1
    loldrivers: 1
    ossem_data_dicts: 1
    cybersec_skills: 1
  temperature: 0.7
  max_retries: 4
  retry_initial_delay_seconds: 2
  retry_max_delay_seconds: 60
  retry_jitter_seconds: 1
  validation_retries: 1
  max_source_chars: 24000  # Trim very large source docs for prompt stability
output:
  format: "jsonl"
  dir: "data/synthesized/"
  manifest: true           # Write generation manifest per batch
