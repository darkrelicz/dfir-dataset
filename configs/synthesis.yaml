# configs/synthesis.yaml
model:
  primary: "gemini-2.5-flash"      # Sole model — sufficient quality at ~$9 total
  fallback: "claude-sonnet-4"      # Only if Flash pilot pass rate < 65%
generation:
  pairs_per_document:
    mitre_attack: 5
    sigma_rules: 3
    atomic_red_team: 4
    cisa_advisories: 5
    volatility3_docs: 4
    mitre_atlas: 4
    cisa_kev: 3
    kape_files: 2
    hayabusa_rules: 2
    lolbas_gtfobins: 3
    forensic_artifacts: 2
    velociraptor_artifacts: 3
    hijacklibs: 1
    loldrivers: 1
    ossem_data_dicts: 1
    cybersec_skills: 3
  temperature: 0.7
  max_retries: 2
  batch_size: 20           # Documents per API batch
output:
  format: "jsonl"
  dir: "data/synthesized/"
  manifest: true           # Write generation manifest per batch
