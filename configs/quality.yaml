  domains:
    windows:
      ids: [W1, W2, W3, W4, W5, W6, W7, W8, W9, W10]
      coverage:
        strong: [W1, W2, W3, W5, W7, W8, W9, W10]
        moderate: [W4, W6]
        weak: []
