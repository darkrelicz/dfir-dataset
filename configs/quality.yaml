    ai_llm:
      ids: [A1, A2, A3, A4]
      coverage:
        strong: [A1, A2, A3]
        moderate: [A4]
        weak: []
    mobile:
      ids: [M1, M2, M3]
      coverage:
        strong: []
        moderate: []
        weak: [M1, M2, M3]
    anti_forensics:
      ids: [AF1, AF2, AF3, AF4]
      coverage:
        strong: [AF1, AF3]
        moderate: []
        weak: [AF2, AF4]
    threat_intel:
      ids: [TI1, TI2]
      coverage:
        strong: []
        moderate: [TI1]
        weak: [TI2]
    iot_ot:
      ids: [OT1, OT2]
      coverage:
        strong: []
        moderate: []
        weak: [OT1, OT2]
    virtualization:
      ids: [V1]
      coverage:
        strong: []
        moderate: []
        weak: [V1]
    supply_chain:
      ids: [SC1]
      coverage:
        strong: []
        moderate: [SC1]
        weak: []
    compliance:
      ids: [CL1, CL2]
      coverage:
        strong: []
        moderate: []
        weak: [CL1, CL2]

scoring:
  weights:
    factual_accuracy: 0.25
    reasoning_quality: 0.25
    operational_relevance: 0.20
    specificity: 0.15
    completeness: 0.15

heuristics:
  generic_penalty_terms:
    - "best practices"
    - "consult your security team"
    - "follow best practices"
    - "further analysis is needed"
    - "further investigation is needed"
    - "more investigation is needed"
    - "review logs"
    - "check logs"
    - "suspicious activity"
    - "this may indicate malicious activity"
  operational_verbs:
    - acquire
    - collect
    - compare
    - confirm
    - correlate
    - decode
    - extract
    - inspect
    - isolate
    - pivot
    - preserve
    - query
    - review
    - scope
    - triage
    - validate

reasoning:
  min_steps: 4
  max_steps: 24

deduplication:
  method: "jaccard_inverted_index"
  jaccard_threshold: 0.8

balance:
  max_source_share: 0.50
  distribution_tolerance: 0.05

manual_spot_check:
  sample_size: 100
  seed: 1337

