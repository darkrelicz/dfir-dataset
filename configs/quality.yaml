      coverage:
        strong: [L1, L2, L3]
        moderate: [L4, L5, L6]
        weak: [L7, L8]
    network:
      ids: [N1, N2, N3, N4, N5, N6]
      coverage:
        strong: []
        moderate: [N2, N4]
        weak: [N1, N3, N5, N6]
    siem:
      ids: [S1, S2, S3]
      coverage:
        strong: [S3]
        moderate: [S1]
        weak: [S2]
