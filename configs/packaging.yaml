input:
  quality_dir: "data/quality/gemini_subset_1"
  filtered_file: "filtered.jsonl"
  review_file: "review_queue.jsonl"
  quality_manifest_file: "quality_manifest.json"

split:
  train: 0.80
  validation: 0.10
  test: 0.10
  seed: 1337
  group_by: "source_doc_id"

format:
  record_format: "messages_jsonl"
  include_system_message: true
  system_message: "You are Shepherd, a DFIR AI assistant. Answer as a careful incident responder: stay grounded in evidence, calibrate uncertainty, and avoid unsupported claims."

response_style:
  filtered: "reasoning"
  review: "direct"
  direct_transform: "strip_reasoning_block"

output:
  format: "jsonl"
  output_dir: "data/packaged/gemini_subset_1"
  train_file: "train.jsonl"
  validation_file: "validation.jsonl"
  test_file: "test.jsonl"
  manifest_file: "packaging_manifest.json"

hosting:
  canonical: "local"
  huggingface_dataset_card: false
  publish_data_to_huggingface: false
