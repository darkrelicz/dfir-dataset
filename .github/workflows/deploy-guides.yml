name: Deploy MarkBind Guides

on:
  push:
    branches:
      - main
      - master
      - guides
    paths:
      - "docs/**"
      - ".github/workflows/deploy-guides.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install PlantUML prerequisites
        run: sudo apt-get update && sudo apt-get install -y default-jre graphviz

      - name: Install MarkBind dependencies
        working-directory: docs
        run: npm ci

      - name: Build guides
        working-directory: docs
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
